<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="196" y1="330" x2="404" y2="538" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A9FE0"/>
      <stop offset="0.55" stop-color="#2B7CC7"/>
      <stop offset="1" stop-color="#2A9B8A"/>
    </linearGradient>
    <linearGradient id="word" x1="470" y1="330" x2="1160" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#7BBFED"/>
    </linearGradient>
    <radialGradient id="halo1" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#4A9FE0" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A9FE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8B4FCC" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8B4FCC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="150" r="360" fill="url(#halo1)"/>
  <circle cx="180" cy="820" r="320" fill="url(#halo2)"/>

  <!-- app icon mark -->
  <g transform="translate(160,300)">
    <rect width="240" height="240" rx="60" fill="url(#iconbg)"/>
    <rect x="1.5" y="1.5" width="237" height="237" rx="58.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="3"/>
    <path d="M110 48 Q126 106 178 122 Q126 138 110 196 Q94 138 42 122 Q94 106 110 48 Z" fill="#FFFFFF"/>
    <path d="M182 52 Q188 74 210 80 Q188 86 182 108 Q176 86 154 80 Q176 74 182 52 Z" fill="#FFFFFF" fill-opacity="0.9"/>
  </g>

  <!-- wordmark -->
  <text x="470" y="418" fill="url(#word)" font-family="Pretendard, Segoe UI, sans-serif" font-size="112" font-weight="800" letter-spacing="-2">HyoClean</text>
  <text x="474" y="486" fill="#8896AA" font-family="Pretendard, Segoe UI, sans-serif" font-size="38" font-weight="500">CCleaner보다 강력하고 더 안전한 Windows 정리 · 실시간 최적화</text>

  <!-- feature pills -->
  <g font-family="Pretendard, Segoe UI, sans-serif" font-size="30" font-weight="600">
    <g transform="translate(470,560)">
      <rect width="238" height="72" rx="36" fill="#4A9FE0" fill-opacity="0.14" stroke="#4A9FE0" stroke-opacity="0.5" stroke-width="2"/>
      <text x="119" y="47" fill="#7BBFED" text-anchor="middle">딥 클린</text>
    </g>
    <g transform="translate(726,560)">
      <rect width="286" height="72" rx="36" fill="#2A9B8A" fill-opacity="0.14" stroke="#2A9B8A" stroke-opacity="0.5" stroke-width="2"/>
      <text x="143" y="47" fill="#5FC3B4" text-anchor="middle">실시간 메모리</text>
    </g>
    <g transform="translate(1030,560)">
      <rect width="210" height="72" rx="36" fill="#8B4FCC" fill-opacity="0.14" stroke="#8B4FCC" stroke-opacity="0.5" stroke-width="2"/>
      <text x="105" y="47" fill="#B589E0" text-anchor="middle">프라이버시</text>
    </g>
    <g transform="translate(1258,560)">
      <rect width="180" height="72" rx="36" fill="#E87820" fill-opacity="0.14" stroke="#E87820" stroke-opacity="0.5" stroke-width="2"/>
      <text x="90" y="47" fill="#F0A15E" text-anchor="middle">최적화</text>
    </g>
  </g>

  <text x="470" y="712" fill="#4A5870" font-family="JetBrains Mono, Consolas, monospace" font-size="26">정리 전 복원지점 · 1클릭 롤백 · KO / EN</text>
  <text x="470" y="770" fill="#4A5870" font-family="JetBrains Mono, Consolas, monospace" font-size="26">by HyoT · hyot.dev</text>
</svg>
