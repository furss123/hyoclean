<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#07090C"/>
    </linearGradient>
    <linearGradient id="tile" x1="88" y1="128" x2="312" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4A9FE0"/>
      <stop offset="1" stop-color="#2B7CC7"/>
    </linearGradient>
    <linearGradient id="word" x1="380" y1="180" x2="900" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#7BBFED"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#4A9FE0" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#4A9FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="480" fill="url(#bg)"/>
  <circle cx="1040" cy="90" r="300" fill="url(#halo)"/>

  <!-- app icon tile -->
  <g transform="translate(88,128)">
    <rect width="224" height="224" rx="50" fill="url(#tile)"/>
    <path d="M112 44 Q123 100 168 112 Q123 124 112 180 Q101 124 56 112 Q101 100 112 44 Z" fill="#FFFFFF"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="380" y="222" fill="url(#word)" font-family="Pretendard, Segoe UI, sans-serif" font-size="96" font-weight="800" letter-spacing="-2">HyoClean</text>
  <text x="384" y="286" fill="#8896AA" font-family="Pretendard, Segoe UI, sans-serif" font-size="32" font-weight="500">CCleaner보다 강력하고 더 안전한 Windows 정리 · 실시간 최적화</text>

  <g font-family="Pretendard, Segoe UI, sans-serif" font-size="26" font-weight="600">
    <g transform="translate(384,330)">
      <rect width="180" height="60" rx="30" fill="#4A9FE0" fill-opacity="0.14" stroke="#4A9FE0" stroke-opacity="0.5" stroke-width="2"/>
      <text x="90" y="39" fill="#7BBFED" text-anchor="middle">딥 클린</text>
    </g>
    <g transform="translate(580,330)">
      <rect width="220" height="60" rx="30" fill="#2A9B8A" fill-opacity="0.14" stroke="#2A9B8A" stroke-opacity="0.5" stroke-width="2"/>
